<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>無料クーポン</title>

<style>

body{

font-family:sans-serif;

background:#f5f7f9;

padding:20px;

}

.container{

max-width:400px;

margin:auto;

background:white;

padding:24px;

border-radius:20px;

box-shadow:0 4px 10px rgba(0,0,0,0.08);

}

h1{

text-align:center;

}

input{

width:100%;

padding:12px;

margin-bottom:12px;

border-radius:10px;

border:1px solid #ccc;

}

button{

width:100%;

padding:14px;

background:#4CAF50;

color:white;

border:none;

border-radius:10px;

font-size:16px;

}

.result{

margin-top:20px;

padding:12px;

background:#eef7ee;

display:none;

border-radius:10px;

}

</style>

</head>

<body>

<div class="container">

<h1>無料クーポン</h1>

<input id="coupon" placeholder="クーポンコード">

<input id="name" placeholder="お名前">

<button onclick="submitCoupon()">

クーポンを使用

</button>

<div class="result" id="result">

クーポンを受付しました。

</div>

</div>

<script>

function submitCoupon(){

const coupon =

document.getElementById("coupon").value;

const name =

document.getElementById("name").value;

if(coupon === "" || name === ""){

alert("入力してください");

return;

}

document.getElementById("result").style.display="block";

}

</script>

</body>

</html>
